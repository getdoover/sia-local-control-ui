<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIA Local Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="hmi">
        <!-- Header -->
        <header class="hmi-header">
            <div class="brand">
                <img src="{{ url_for('static', filename='remote_command_logo.png') }}" alt="" class="brand-logo">
                <span class="brand-title">SIA Local Control</span>
            </div>
            <div class="header-status">
                <span id="connection-status" class="conn conn-down">
                    <span class="dot"></span> Disconnected
                </span>
                <span class="last-update">Updated <span id="last-update">--</span></span>
            </div>
        </header>

        <main class="hmi-main">
            <!-- Left: pump status + command surface -->
            <section class="col-primary">
                <div id="pump-cards" class="pump-cards"><!-- pump cards injected here --></div>

                <div class="command-bar">
                    <div class="cmd-row">
                        <button class="cmd-btn cmd-start" data-cmd="set_pump_state" data-value="start">
                            <span class="cmd-icon">&#9654;</span> Start
                        </button>
                        <button class="cmd-btn cmd-stop" data-cmd="set_pump_state" data-value="stop">
                            <span class="cmd-icon">&#9632;</span> Stop
                        </button>
                        <button class="cmd-btn cmd-reset" data-cmd="reset_fault">
                            Reset Fault
                        </button>
                    </div>
                    <div class="cmd-row">
                        <button class="cmd-btn cmd-nudge" data-cmd="nudge_rate" data-value="-1">
                            <span class="cmd-icon">&#9660;</span> Flow Down
                        </button>
                        <button class="cmd-btn cmd-nudge" data-cmd="nudge_rate" data-value="+1">
                            <span class="cmd-icon">&#9650;</span> Flow Up
                        </button>
                        <div class="rate-set">
                            <input id="rate-input" type="number" step="0.1" min="0" inputmode="decimal" placeholder="Rate">
                            <button id="rate-set-btn" class="cmd-btn cmd-set">Set</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right: peripheral status -->
            <aside class="col-aux">
                <section class="aux-card hidden" id="solar-card">
                    <h3>Solar</h3>
                    <div class="aux-grid">
                        <div class="metric"><span class="m-label">Battery</span><span class="m-value"><span id="battery-voltage">0.0</span> V</span></div>
                        <div class="metric"><span class="m-label">Charge</span><span class="m-value"><span id="battery-percentage">0</span> %</span>
                            <div class="bar"><div class="bar-fill" id="battery-progress"></div></div>
                        </div>
                        <div class="metric"><span class="m-label">Panel</span><span class="m-value"><span id="panel-power">0.0</span> W</span></div>
                        <div class="metric"><span class="m-label">Capacity</span><span class="m-value"><span id="battery-ah">0.0</span> Ah</span></div>
                    </div>
                </section>

                <section class="aux-card hidden" id="tank-card">
                    <h3>Tank</h3>
                    <div class="aux-grid">
                        <div class="metric"><span class="m-label">Level</span><span class="m-value"><span id="tank-level-mm">0</span> mm</span></div>
                        <div class="metric"><span class="m-label">Fill</span><span class="m-value"><span id="tank-level-percent">0</span> %</span>
                            <div class="bar"><div class="bar-fill" id="tank-progress"></div></div>
                        </div>
                    </div>
                </section>

                <section class="aux-card hidden" id="skid-card">
                    <h3>Skid</h3>
                    <div class="aux-grid">
                        <div class="metric"><span class="m-label">Flow</span><span class="m-value"><span id="skid-flow">0.0</span> <span class="skid-flow-unit"></span></span></div>
                        <div class="metric"><span class="m-label">Pressure</span><span class="m-value"><span id="skid-pressure">0.0</span> <span class="skid-pressure-unit"></span></span></div>
                    </div>
                </section>
            </aside>
        </main>

        <!-- Doover footer -->
        <div class="footer-logo">
            <img src="{{ url_for('static', filename='Doover Logo - Landscape - Frost White.svg') }}" alt="Doover">
        </div>
    </div>

    <!-- Fault popover -->
    <div id="fault-popover" class="overlay hidden">
        <div class="overlay-card fault-card">
            <h2>Fault Detected</h2>
            <ul id="fault-message-list"></ul>
            <p class="fault-hint">Press Reset Fault (or the Start button) once the condition clears.</p>
        </div>
    </div>

    <!-- Command spinner -->
    <div id="command-overlay" class="overlay hidden">
        <div class="overlay-card">
            <div class="spinner"></div>
            <p id="command-overlay-text">Sending command...</p>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="overlay">
        <div class="overlay-card">
            <div class="spinner"></div>
            <p>Connecting to controller...</p>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
