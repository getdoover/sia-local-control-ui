[project]
name = "sia-local-control-ui"
version = "0.1.0"
description = "Channel-native Doover HMI widget and physical operator-panel adapter for Solar Injection Australia chemical injection skids."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.11.2",
]

[project.scripts]
doover-app-run = "sia_local_control_ui:main"
export-config = "sia_local_control_ui.app_config:export"
export-ui = "sia_local_control_ui.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio==1.67.0",
    "protobuf==5.28.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
