[project]
name = "sia-local-control-ui"
version = "0.1.0"
description = "Local HMI touchscreen app for Solar Injection Australia chemical injection skids: a Flask/SocketIO dashboard that renders the pump controller's status and drives it (Start/Stop/rate) through the Doover 2.0 RPC command surface, and owns the operator surface (physical pushbuttons + RUN/TRIP lamps)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.11.3",
    "flask>=3.0.0",
    "flask-socketio>=5.3.0",
    "python-socketio>=5.9.0",
]

[project.scripts]
doover-app-run = "sia_local_control_ui:main"
export-config = "sia_local_control_ui.app_config:export"
export-ui = "sia_local_control_ui.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio==1.67.0",
    "protobuf==5.28.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]
