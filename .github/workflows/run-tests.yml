name: Run Tests

on:
  workflow_call:

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    container:
      image: spaneng/doover_device_base

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
            cache-dependency-glob: "uv.lock"

      - name: Install the project
        run: |
          uv sync --locked --all-extras --dev

      - name: Run tests
        # This might use `doover app test` in the future.
        run: uv run pytest tests

  widget_tests:
    # The HMI screen (widget/): unit suites, typecheck, the single-file build,
    # and the kiosk layout + end-to-end command/actor checks in Chromium.
    name: Widget Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout
